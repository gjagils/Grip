# XcodeGen-projectdefinitie. Genereer het Xcode-project met:
#   brew install xcodegen
#   xcodegen generate
name: GripWorkout
options:
  bundleIdPrefix: nl.gjagils
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GripWorkout:
    type: application
    platform: iOS
    sources:
      - GripWorkout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.gjagils.gripworkout
        TARGETED_DEVICE_FAMILY: "1"
        # Vul je eigen Team ID in, of kies je team in Xcode onder Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: GripWorkout/Info.plist
      properties:
        CFBundleDisplayName: Workout Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Maak een foto van een trainingsschema.
        # Grip draait via Tailscale op http (geen https). Voor een persoonlijke app prima;
        # zet je Grip achter https, dan kan dit weg.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
